<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b1a4d"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </linearGradient>
    <linearGradient id="phInk" x1="8" y1="8" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- 外框：圆角矩形，深紫黑渐变底 -->
  <rect width="32" height="32" rx="7" fill="url(#phBg)"/>
  <!-- 顶部高光描边，增加质感 -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- 分支汇聚：两条分支汇入主线，粉→紫→天蓝渐变 -->
  <!-- 上分支 -->
  <path d="M8 10 L8 14 L14 18 L14 22" fill="none" stroke="url(#phInk)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8" cy="10" r="2.2" fill="url(#phInk)"/>
  <!-- 下分支 -->
  <path d="M24 10 L24 14 L18 18 L18 22" fill="none" stroke="url(#phInk)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="10" r="2.2" fill="url(#phInk)"/>
  <!-- 汇聚主线 -->
  <path d="M14 22 L16 24 L18 22" fill="none" stroke="url(#phInk)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="24" r="2.2" fill="url(#phInk)"/>
</svg>
