name: Deploy frontend to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

concurrency:
  # env context is not available in concurrency.group — inline the branch expression.
  group: vercel-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    # Deploys only after CI has passed on the same commit; workflow_dispatch stays available as the
    # deliberate manual escape hatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      # env context is not available in environment.name either — inline it.
      name: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production-vercel' || 'preview-vercel' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull Vercel project settings
        run: npx --yes vercel@latest pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
        env:
          VERCEL_ENV: ${{ env.DEPLOY_BRANCH == 'main' && 'production' || 'preview' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build Vercel deployment
        run: npx --yes vercel@latest build ${{ env.DEPLOY_BRANCH == 'main' && '--prod' || '' }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to Vercel
        id: deploy
        run: |
          if [[ "$DEPLOY_BRANCH" == "main" ]]; then
            DEPLOYMENT_URL="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          else
            DEPLOYMENT_URL="$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")"
          fi
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Mobile monitoring (2026-10-29 plan, layer 1): no-op unless FEISHU_WEBHOOK is set.
      - name: Notify failure (Feishu)
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$FEISHU_WEBHOOK" ]]; then
            echo "::warning title=Notify skipped::Missing repository secret FEISHU_WEBHOOK."
            exit 0
          fi
          curl -fsS -m 10 -X POST "$FEISHU_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "[pr-helper] $WORKFLOW 失败" --arg m "工作流 $WORKFLOW 失败：$RUN_URL" '{msg_type:"text", content:{text:($t + "\n" + $m)}}')" \
            || echo "::warning title=Notify::Feishu webhook 调用失败"
